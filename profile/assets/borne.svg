<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="La borne Scubanion"><title>La borne Scubanion</title><desc>Schema anime de la borne : ecran, anneau de LED, lecteur NFC, microcontroleur, chaque element annote a son tour.</desc><defs><linearGradient id="fond-b" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#16282E"/><stop offset=".6" stop-color="#1E3A42"/><stop offset="1" stop-color="#204E5A"/></linearGradient><linearGradient id="ecr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F6B7A"/><stop offset="1" stop-color="#204E5A"/></linearGradient></defs><rect width="1000" height="450" rx="24" fill="url(#fond-b)"/><ellipse cx="505" cy="388" rx="110" ry="16" fill="#000" opacity=".30"/><rect x="430" y="48" width="150" height="334" rx="26" fill="#243d45" stroke="#204E5A" stroke-width="3"/><rect x="446" y="68" width="118" height="150" rx="14" fill="url(#ecr)"/><rect x="458" y="82" width="94" height="100" rx="8" fill="#DCEBEE" opacity=".9"/><g transform="translate(505 144) scale(.5)"><rect x="-30" y="-4" width="60" height="8" rx="4" fill="#1E3A42"/><rect x="-19" y="-36" width="38" height="34" rx="4" fill="#1E3A42"/><rect x="-19" y="-14" width="38" height="8" fill="#F0855A"/></g><text x="505" y="198" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#F5FAFB" text-anchor="middle">Chapeau du Portrait</text><circle cx="505" cy="260" r="30" fill="none" stroke="#204E5A" stroke-width="7" opacity=".35"/><circle cx="505" cy="260" r="30" fill="none" stroke="#34C77B" stroke-width="7" stroke-linecap="round" stroke-dasharray="188" stroke-dashoffset="188" transform="rotate(-90 505 260)"><animate attributeName="stroke-dashoffset" values="188;188;0;0;188;188" dur="11s" keyTimes="0;.12;.30;.72;.80;1" repeatCount="indefinite"/></circle><rect x="456" y="292" width="98" height="46" rx="12" fill="#8FB9C2" opacity=".22"/><text x="505" y="320" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#DCEBEE" text-anchor="middle" letter-spacing="1.4">NFC</text><circle cx="426" cy="314" r="14" fill="none" stroke="#F0855A" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;.85;0;0" dur="11s" keyTimes="0;0.06;0.1;0.17;1" repeatCount="indefinite"/></circle><circle cx="426" cy="314" r="24" fill="none" stroke="#F0855A" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;.85;0;0" dur="11s" keyTimes="0;0.07;0.11;0.18;1" repeatCount="indefinite"/></circle><circle cx="426" cy="314" r="34" fill="none" stroke="#F0855A" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;.85;0;0" dur="11s" keyTimes="0;0.08;0.12;0.19;1" repeatCount="indefinite"/></circle><text x="505" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8FB9C2" text-anchor="middle" letter-spacing="2">SCUBANION</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" dur="11s" keyTimes="0;0;0.02;0.23;0.25;1" repeatCount="indefinite"/><line x1="590" y1="118" x2="700" y2="118" stroke="#F0855A" stroke-width="2.4" stroke-dasharray="5 5"/><circle cx="590" cy="118" r="5" fill="#F0855A"/><text x="714" y="114" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Écran</text><text x="714" y="138" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8FB9C2" text-anchor="start">il montre le lieu et l’objet débloqué</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" dur="11s" keyTimes="0;0.25;0.27;0.48;0.5;1" repeatCount="indefinite"/><line x1="590" y1="260" x2="700" y2="260" stroke="#F0855A" stroke-width="2.4" stroke-dasharray="5 5"/><circle cx="590" cy="260" r="5" fill="#F0855A"/><text x="714" y="256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Anneau de LED</text><text x="714" y="280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8FB9C2" text-anchor="start">il se remplit pendant la lecture</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" dur="11s" keyTimes="0;0.5;0.52;0.73;0.75;1" repeatCount="indefinite"/><line x1="420" y1="314" x2="292" y2="314" stroke="#F0855A" stroke-width="2.4" stroke-dasharray="5 5"/><circle cx="420" cy="314" r="5" fill="#F0855A"/><text x="278" y="310" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="end">Lecteur NFC</text><text x="278" y="334" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8FB9C2" text-anchor="end">le téléphone s’approche, rien à saisir</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" dur="11s" keyTimes="0;0.75;0.77;0.98;1;1" repeatCount="indefinite"/><line x1="420" y1="198" x2="292" y2="198" stroke="#F0855A" stroke-width="2.4" stroke-dasharray="5 5"/><circle cx="420" cy="198" r="5" fill="#F0855A"/><text x="278" y="194" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="end">Microcontrôleur</text><text x="278" y="218" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8FB9C2" text-anchor="end">il publie le passage en MQTT</text></g><text x="40" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8FB9C2" letter-spacing="2.2">NOTRE SEUL OBJET</text><text x="40" y="420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#DCEBEE">Un objet conçu de bout en bout, du microcontrôleur au protocole — plutôt que deux à moitié.</text></svg>