<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="La boucle Scubanion"><title>La boucle Scubanion</title><desc>Diagramme anime : marcher fait grandir le compagnon, qui envoie vers une quete, puis vers une borne, qui debloque un objet exclusif, ce qui redonne envie de marcher.</desc><defs><linearGradient id="bcl-corps" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#9DC6CE"/><stop offset=".55" stop-color="#6FA3AE"/><stop offset="1" stop-color="#4A8491"/></linearGradient></defs><rect width="1000" height="380" rx="24" fill="#F5FAFB"/><circle cx="500" cy="190" r="95" fill="none" stroke="#8FB9C2" stroke-width="2.5" stroke-dasharray="7 9" opacity=".55"/><circle r="7" fill="#F0855A"><animateMotion dur="10s" repeatCount="indefinite" path="M 500 95 a 95 95 0 1 1 -0.1 0"/></circle><circle cx="500" cy="95" r="15" fill="#ffffff" stroke="#2F6B7A" stroke-width="3"><animate attributeName="fill" values="#ffffff;#F0855A;#ffffff;#ffffff" dur="10s" begin="0s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/><animate attributeName="r" values="15;20;15;15" dur="10s" begin="0s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/></circle><text x="500" y="100" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#204E5A" text-anchor="middle">1</text><text x="500" y="31" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A42" text-anchor="middle">Tu marches</text><text x="500" y="49" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4C6B73" text-anchor="middle">le téléphone compte</text><circle cx="590.35" cy="160.64" r="15" fill="#ffffff" stroke="#2F6B7A" stroke-width="3"><animate attributeName="fill" values="#ffffff;#F0855A;#ffffff;#ffffff" dur="10s" begin="2s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/><animate attributeName="r" values="15;20;15;15" dur="10s" begin="2s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/></circle><text x="590.35" y="165.64" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#204E5A" text-anchor="middle">2</text><text x="651.22" y="140.87" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A42" text-anchor="start">Il grandit</text><text x="651.22" y="158.87" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4C6B73" text-anchor="start">chaque pas vaut de l'XP</text><circle cx="555.84" cy="266.86" r="15" fill="#ffffff" stroke="#2F6B7A" stroke-width="3"><animate attributeName="fill" values="#ffffff;#F0855A;#ffffff;#ffffff" dur="10s" begin="4s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/><animate attributeName="r" values="15;20;15;15" dur="10s" begin="4s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/></circle><text x="555.84" y="271.86" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#204E5A" text-anchor="middle">3</text><text x="593.46" y="318.63" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A42" text-anchor="start">Une quête</text><text x="593.46" y="336.63" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4C6B73" text-anchor="start">à moins de 500 m</text><circle cx="444.16" cy="266.86" r="15" fill="#ffffff" stroke="#2F6B7A" stroke-width="3"><animate attributeName="fill" values="#ffffff;#F0855A;#ffffff;#ffffff" dur="10s" begin="6s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/><animate attributeName="r" values="15;20;15;15" dur="10s" begin="6s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/></circle><text x="444.16" y="271.86" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#204E5A" text-anchor="middle">4</text><text x="406.54" y="318.63" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A42" text-anchor="end">Une borne</text><text x="406.54" y="336.63" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4C6B73" text-anchor="end">chez un partenaire</text><circle cx="409.65" cy="160.64" r="15" fill="#ffffff" stroke="#2F6B7A" stroke-width="3"><animate attributeName="fill" values="#ffffff;#F0855A;#ffffff;#ffffff" dur="10s" begin="8s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/><animate attributeName="r" values="15;20;15;15" dur="10s" begin="8s" repeatCount="indefinite" keyTimes="0;.05;.17;1"/></circle><text x="409.65" y="165.64" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#204E5A" text-anchor="middle">5</text><text x="348.78" y="140.87" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A42" text-anchor="end">Un objet</text><text x="348.78" y="158.87" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4C6B73" text-anchor="end">exclusif au lieu</text><g transform="translate(500 194)"><g transform="scale(0.55)"><g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0; 0 4; 0 0" dur="4.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/><g transform="translate(-72 6)"><animateTransform attributeName